[package]
name = "navita"
version = "0.1.0"
description = "A minimal, fast, native-feeling file browser for macOS"
authors = ["sgchris"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "navita_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dependencies]
dirs = "6"
libc = "0.2"
notify = "8"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
ts-rs = "12"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile = "3"
